<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Pipa & Sisa Pulang Teknisi</title>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --danger: #c0392b; --bg: #f4f6f9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin: auto; }
        h2 { color: var(--primary); text-align: center; margin-top: 0; font-size: 20px; }
        .rule-card { background: #e8f4fd; border-left: 4px solid #3498db; padding: 12px; font-size: 13px; margin-bottom: 20px; border-radius: 4px; line-height: 1.5; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #ccd1d9; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .readonly-input { background: #e9ecef; font-weight: bold; color: #495057; }
        button { background: var(--success); color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #219653; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        
        /* Modal Peringatan */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; max-width: 350px; width: 90%; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-title { color: var(--danger); font-size: 17px; font-weight: bold; margin-bottom: 10px; }
        .modal-body { font-size: 13px; margin-bottom: 20px; line-height: 1.5; color: #555; text-align: left; }
        .modal-btn { background: var(--danger); color: white; border: none; padding: 8px 16px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; }
        .loading { text-align: center; font-size: 13px; color: #e67e22; margin-top: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Laporan Pipa & Sisa Pulang</h2>
    
    <div class="rule-card">
        <strong>Aturan Ketat Gudang:</strong><br>
        1. Pilih merk pipa dan catat ukuran yang dibawa serta terpakai.<br>
        2. Sisa pipa yang <b>dibawa pulang kembali ke gudang</b> TIDAK BOLEH 1 atau 2 meter!
    </div>

    <form id="pipeForm">
        <div class="form-group">
            <label>Nama Teknisi</label>
            <input type="text" id="teknisi" required placeholder="Contoh: Budi">
        </div>
        <div class="form-group">
            <label>Merk Pipa</label>
            <select id="merkPipa" required>
                <option value="" disabled selected>-- Pilih Merk Pipa --</option>
                <option value="Tateho">Tateho</option>
                <option value="Hoda">Hoda</option>
                <option value="Inada">Inada</option>
                <option value="Denpoo">Denpoo</option>
                <option value="Merk Lainnya">Merk Lainnya</option>
            </select>
        </div>
        <div class="form-group">
            <label>Nama Customer / Lokasi</label>
            <input type="text" id="customer" required placeholder="Contoh: Pak Joko">
        </div>
        <div class="form-group">
            <label>Pipa yang DIBAWA (Termasuk Cadangan)</label>
            <input type="number" id="pipaBawa" required placeholder="Contoh: Bawa 10 meter" min="1">
        </div>
        <div class="form-group">
            <label>Pipa yang TERPAKAI Aktual di Lokasi</label>
            <input type="number" id="pipaPakai" required placeholder="Contoh: Terpakai 8 meter" min="1">
        </div>
        <div class="form-group">
            <label>Sisa Pipa yang DIBAWA PULANG (Otomatis)</label>
            <input type="text" id="sisaPulang" class="readonly-input" readonly placeholder="Akan terhitung otomatis">
        </div>
        
        <button type="submit" id="btnSubmit">Kirim Laporan ke Google Sheets</button>
        <div id="loadingText" class="loading">Sedang mengirim data...</div>
    </form>
</div>

<!-- Modal Peringatan Sisa 1-2 Meter -->
<div id="alertModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">⛔ PELANGGARAN SISA 1-2 METER!</div>
        <div class="modal-body" id="modalText">
            Pesan peringatan...
        </div>
        <button class="modal-btn" onclick="closeModal()">Ubah Perhitungan</button>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4xHubo3GdyGj4joHV4_pMw55uFFJXuh_j2R7j_jD2puCEN-CDGw3YGmgLNY2xk9Ma6g/exec";

    const pipaBawa = document.getElementById('pipaBawa');
    const pipaPakai = document.getElementById('pipaPakai');
    const sisaPulang = document.getElementById('sisaPulang');
    const alertModal = document.getElementById('alertModal');
    const modalText = document.getElementById('modalText');
    const btnSubmit = document.getElementById('btnSubmit');
    const loadingText = document.getElementById('loadingText');

    function hitungSisa() {
        let bawa = parseFloat(pipaBawa.value) || 0;
        let pakai = parseFloat(pipaPakai.value) || 0;
        let sisa = bawa - pakai;
        
        if (pipaBawa.value !== "" && pipaPakai.value !== "") {
            if (sisa < 0) {
                sisaPulang.value = "Pemakaian melebihi bawaan!";
            } else {
                sisaPulang.value = sisa + " Meter";
            }
        } else {
            sisaPulang.value = "";
        }
    }

    pipaBawa.addEventListener('input', hitungSisa);
    pipaPakai.addEventListener('input', hitungSisa);

    document.getElementById('pipeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        let bawa = parseFloat(pipaBawa.value);
        let pakai = parseFloat(pipaPakai.value);
        let sisa = bawa - pakai;

        if (sisa < 0) {
            alert("Jumlah pipa terpakai tidak boleh lebih besar dari pipa yang dibawa!");
            return;
        }

        // VALIDASI UTAMA: Cek apakah sisa pulang 1 atau 2 meter
        if (sisa > 0 && sisa < 3) {
            modalText.innerHTML = `Anda membawa <b>${bawa} meter</b> dan terpakai <b>${pakai} meter</b>.<br><br>` +
                                  `Sisa yang dibawa pulang adalah <b>${sisa} meter</b>.<br><br>` +
                                  `<span style="color:red; font-weight:bold;">Sisa 1-2 meter dilarang karena menjadi barang mati!</span><br><br>` +
                                  `<b>Solusi:</b> Sesuaikan pemakaian atau potong pas agar sisa pulang menjadi 0 meter atau minimal 3 meter.`;
            alertModal.style.display = "flex";
            return;
        }

        let payload = {
            teknisi: document.getElementById('teknisi').value,
            merkPipa: document.getElementById('merkPipa').value,
            customer: document.getElementById('customer').value,
            bawa: bawa,
            pakai: pakai
        };

        btnSubmit.disabled = true;
        loadingText.style.display = "block";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert("Laporan berhasil dikirim! Merk pipa, teknisi, dan rincian sisa sudah tercatat di Google Sheets.");
            document.getElementById('pipeForm').reset();
            sisaPulang.value = "";
        })
        .catch(error => {
            alert("Terjadi kesalahan koneksi: " + error);
        })
        .finally(() => {
            btnSubmit.disabled = false;
            loadingText.style.display = "none";
        });
    });

    function closeModal() {
        alertModal.style.display = "none";
    }
</script>

</body>
</html>
